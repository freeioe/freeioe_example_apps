#========= 动态参数配置 =========
# vpnMode: 工作模式
client

# vpnDev: 虚拟网络设备tap、tun
dev tap

# vpnProtocol: 协议
proto tcp

# vpnDestination vpnPort: vpn服务端监听IP端口
remote 10.80.89.3 41807

# vpnNoBind: vpn客户端不绑定到本地地址和端口
nobind

# vpnCa: ca证书
ca hdm2movpn_ca.crt

# vpnCert: 密钥
cert hdm2movpn_client.crt

# vpnKey: 密钥
key hdm2movpn_client.key

# vpnCompress: 是否压缩
comp-lzo

# vpnCipher: 密码方式
cipher AES-128-CBC

#========= 默认参数配置 =========
ns-cert-type server
resolv-retry infinite
persist-key
persist-tun
verb 3

